title: "Deck\nDesigner"
tooltip: |-
  START HERE to create a complete deck layout.

  First create and select a flat rectangular Revit Floor as the deck footprint.
  Choose board direction, stock length, picture-frame borders, clips, and field/border materials.
  Review quantities, then generate individual boards and clips above the Floor.

  Also saves cut lists, stock cutting schedules, and material estimates to Documents/DECKTOOLS_Exports.
  Rerun on the same Floor to replace its previous layout. Open a 3D view to inspect the result.
  Board grooves and built-in clips are schematic; framing and fastening need separate specification.
author: DECKTOOLS
